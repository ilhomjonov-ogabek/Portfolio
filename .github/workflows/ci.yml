name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate index.html 404.html
